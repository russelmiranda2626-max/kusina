<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KusinaAI - Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-deep: #9a3412;
            --primary-light: #fff7ed;
            --primary-soft: #ffedd5;
            --bg-main: #fffaf5;
            --ink: #1c1917;
            --text-muted: #78716c;
            --border-color: #ece7e2;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --shadow-sm: 0 1px 2px rgba(28,25,23,.04), 0 2px 8px rgba(28,25,23,.04);
            --shadow-md: 0 18px 40px -12px rgba(249,115,22,.28);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--ink); line-height: 1.55; padding-bottom: 60px; }

        /* ---------- NAVBAR ---------- */
        .navbar {
            background: rgba(255,250,245,.85); backdrop-filter: blur(14px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color);
            padding: .85rem 2rem; display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; color: var(--ink); text-decoration: none; }
        .brand .mark {
            width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-size: .95rem;
            box-shadow: 0 6px 14px rgba(249,115,22,.35);
        }
        .brand b { color: var(--primary-dark); }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .btn-nav {
            background: var(--primary-light); color: var(--primary-dark); border: 1.5px solid #fed7aa; padding: .5rem 1.1rem;
            border-radius: 30px; font-weight: 700; cursor: pointer; font-size: .85rem; text-decoration: none;
            display: flex; align-items: center; gap: 8px; transition: .2s;
        }
        .btn-nav:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-1px); }
        .lang-switch { display: flex; background: #fff; border: 1.5px solid #fed7aa; border-radius: 30px; padding: 3px; }
        .lang-switch button {
            border: none; background: transparent; color: var(--text-muted); font-weight: 800; font-size: .78rem;
            padding: 5px 12px; border-radius: 30px; cursor: pointer; transition: .2s;
        }
        .lang-switch button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 10px rgba(249,115,22,.3); }

        /* ---------- PAGE ---------- */
        .container { max-width: 1040px; margin: 2rem auto; padding: 0 1.5rem; }
        .page-head { margin-bottom: 1.6rem; }
        .page-head h1 { font-family: 'Fraunces', serif; font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
        .page-head p { color: var(--text-muted); margin-top: 4px; }

        .account-grid { display: grid; grid-template-columns: 330px 1fr; gap: 1.5rem; align-items: start; }
        .col { display: grid; gap: 1.5rem; }

        .card {
            background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-xl);
            padding: 1.7rem; box-shadow: var(--shadow-sm);
        }
        .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
        .card-head .s-ico {
            width: 42px; height: 42px; border-radius: 14px; background: var(--primary-soft); color: var(--primary-dark);
            display: grid; place-items: center; font-size: 1.05rem; flex-shrink: 0;
        }
        .card-head h3 { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 800; letter-spacing: -.01em; }

        /* ---------- PROFILE ---------- */
        .profile-card { text-align: center; position: sticky; top: 88px; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 1rem; display: grid; place-items: center;
            font-family: 'Fraunces', serif; font-size: 2.3rem; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-deep));
            box-shadow: 0 14px 30px -8px rgba(249,115,22,.55), 0 0 0 6px var(--primary-soft);
        }
        .profile-card h2 { font-family: 'Fraunces', serif; font-size: 1.55rem; font-weight: 800; line-height: 1.2; word-break: break-word; }
        .profile-card .email { color: var(--text-muted); font-size: .92rem; margin-top: 2px; word-break: break-all; }
        .joined {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; background: var(--primary-soft); color: var(--primary-dark);
            font-weight: 800; font-size: .76rem; padding: 5px 13px; border-radius: 30px;
        }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1.3rem; }
        .stat { background: #fdf9f5; border: 1px solid var(--border-color); border-radius: 14px; padding: 12px 8px; }
        .stat b { display: block; font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 800; color: var(--primary-dark); line-height: 1.1; }
        .stat span { font-size: .7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }

        .btn-logout-big {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 1.5rem; padding: 12px;
            border-radius: 12px; background: #fff; color: #b91c1c; border: 1.5px solid #fecaca; font-weight: 800; font-size: .95rem;
            text-decoration: none; cursor: pointer; transition: .2s;
        }
        .btn-logout-big:hover { background: #ef4444; color: #fff; border-color: #ef4444; transform: translateY(-1px); }

        /* ---------- ABOUT ---------- */
        .about-p { color: #57534e; font-size: .95rem; }
        .feat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1.1rem; }
        .feat {
            display: flex; align-items: center; gap: 12px; background: #fdf9f5; border: 1px solid var(--border-color);
            border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: .86rem;
        }
        .feat i {
            width: 34px; height: 34px; border-radius: 11px; background: var(--primary-soft); color: var(--primary-dark);
            display: grid; place-items: center; font-size: .9rem; flex-shrink: 0;
        }
        .about-foot { margin-top: 1.1rem; font-size: .78rem; font-weight: 700; color: var(--text-muted); }

        /* ---------- MANUAL (accordion) ---------- */
        .manual { display: grid; gap: 10px; }
        .manual details { background: #fdf9f5; border: 1px solid var(--border-color); border-radius: 14px; transition: .2s; }
        .manual details[open] { background: #fff; border-color: #fdba74; box-shadow: 0 6px 18px -8px rgba(249,115,22,.35); }
        .manual summary {
            list-style: none; cursor: pointer; padding: 13px 16px; font-weight: 800; font-size: .92rem;
            display: flex; align-items: center; gap: 12px;
        }
        .manual summary::-webkit-details-marker { display: none; }
        .manual summary .num {
            width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .75rem;
            display: grid; place-items: center; flex-shrink: 0;
        }
        .manual summary .chev { margin-left: auto; color: var(--text-muted); font-size: .8rem; transition: transform .2s; }
        .manual details[open] summary .chev { transform: rotate(180deg); color: var(--primary-dark); }
        .manual .ans { padding: 0 16px 15px 54px; color: #57534e; font-size: .9rem; }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 860px) {
            .account-grid { grid-template-columns: 1fr; }
            .profile-card { position: static; }
        }
        @media (max-width: 600px) {
            .navbar { padding: .75rem 1rem; }
            .nav-actions { gap: 6px; }
            .btn-nav span { display: none; }
            .container { padding: 0 1rem; margin-top: 1.2rem; }
            .page-head h1 { font-size: 1.8rem; }
            .feat-grid { grid-template-columns: 1fr; }
            .manual .ans { padding-left: 16px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="brand"><div class="mark"><i class="fa-solid fa-utensils"></i></div> Kusina<b>AI</b></a>
        <div class="nav-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <button id="lang-tl" onclick="setLang('tl')">TL</button>
                <button id="lang-en" onclick="setLang('en')">EN</button>
            </div>
            <a href="/" class="btn-nav"><i class="fa-solid fa-house"></i> <span data-i18n="nav_home"></span></a>
        </div>
    </nav>

    <main class="container">
        <div class="page-head">
            <h1 data-i18n="page_title"></h1>
            <p data-i18n="page_sub"></p>
        </div>

        <div class="account-grid">
            <!-- PROFILE + LOGOUT -->
            <aside class="card profile-card">
                <div class="avatar" id="avatar"></div>
                <h2 id="uName"></h2>
                <p class="email" id="uEmail"></p>
                <span class="joined" id="uJoined" style="display:none;"><i class="fa-regular fa-calendar-check"></i> <span id="uJoinedText"></span></span>

                <div class="stats">
                    <div class="stat"><b id="statDishes">0</b><span data-i18n="stat_dishes"></span></div>
                    <div class="stat"><b id="statDays">0</b><span data-i18n="stat_days"></span></div>
                </div>

                <a href="/logout" class="btn-logout-big" onclick="return confirmLogout()">
                    <i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="logout"></span>
                </a>
            </aside>

            <section class="col">
                <!-- ABOUT -->
                <div class="card">
                    <div class="card-head">
                        <div class="s-ico"><i class="fa-solid fa-circle-info"></i></div>
                        <h3 data-i18n="about_title"></h3>
                    </div>
                    <p class="about-p" data-i18n="about_p"></p>
                    <div class="feat-grid">
                        <div class="feat"><i class="fa-solid fa-book-open"></i> <span data-i18n="about_f1"></span></div>
                        <div class="feat"><i class="fa-solid fa-calendar-days"></i> <span data-i18n="about_f2"></span></div>
                        <div class="feat"><i class="fa-solid fa-robot"></i> <span data-i18n="about_f3"></span></div>
                        <div class="feat"><i class="fa-solid fa-language"></i> <span data-i18n="about_f4"></span></div>
                    </div>
                    <p class="about-foot">KusinaAI &middot; Digital Cookbook &amp; Meal Planner</p>
                </div>

                <!-- USER MANUAL -->
                <div class="card">
                    <div class="card-head">
                        <div class="s-ico"><i class="fa-solid fa-book-bookmark"></i></div>
                        <h3 data-i18n="manual_title"></h3>
                    </div>
                    <div class="manual">
                        <details open>
                            <summary><span class="num">1</span> <span data-i18n="m1_q"></span> <i class="fa-solid fa-chevron-down chev"></i></summary>
                            <div class="ans" data-i18n="m1_a"></div>
                        </details>
                        <details>
                            <summary><span class="num">2</span> <span data-i18n="m2_q"></span> <i class="fa-solid fa-chevron-down chev"></i></summary>
                            <div class="ans" data-i18n="m2_a"></div>
                        </details>
                        <details>
                            <summary><span class="num">3</span> <span data-i18n="m3_q"></span> <i class="fa-solid fa-chevron-down chev"></i></summary>
                            <div class="ans" data-i18n="m3_a"></div>
                        </details>
                        <details>
                            <summary><span class="num">4</span> <span data-i18n="m4_q"></span> <i class="fa-solid fa-chevron-down chev"></i></summary>
                            <div class="ans" data-i18n="m4_a"></div>
                        </details>
                        <details>
                            <summary><span class="num">5</span> <span data-i18n="m5_q"></span> <i class="fa-solid fa-chevron-down chev"></i></summary>
                            <div class="ans" data-i18n="m5_a"></div>
                        </details>
                        <details>
                            <summary><span class="num">6</span> <span data-i18n="m6_q"></span> <i class="fa-solid fa-chevron-down chev"></i></summary>
                            <div class="ans" data-i18n="m6_a"></div>
                        </details>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const USER = {{ user | tojson }};

        const I18N = {
            tl: {
                nav_home: 'Home',
                page_title: 'Aking Account',
                page_sub: 'Ang iyong impormasyon, gabay sa paggamit, at logout.',
                joined: 'Miyembro mula {date}',
                stat_dishes: 'Ulam sa kalendaryo', stat_days: 'Araw na may plano',
                logout: 'Mag-logout',
                confirm_logout: 'Sigurado ka bang gusto mong mag-logout?',
                about_title: 'Tungkol sa KusinaAI',
                about_p: 'Ang KusinaAI ay digital cookbook at meal planner para sa mga lutuing Pilipino. Maghanap ng resipe, planuhin ang pagkain mo sa buong linggo, at magtanong sa AI Chef kahit kailan.',
                about_f1: 'Cookbook ng mga resipeng Pinoy',
                about_f2: 'Kalendaryo ng pagkain sa linggo',
                about_f3: 'AI Chef na sumasagot sa tanong mo',
                about_f4: 'Tagalog at English',
                manual_title: 'Gabay sa Paggamit',
                m1_q: 'Paano maghanap ng resipe?',
                m1_a: 'Sa home page, i-type ang pangalan ng ulam o sangkap sa search box at pindutin ang Hanapin. Puwede ring pindutin ang mga mabilisang button gaya ng Adobo, Gulay, Pang-Health, o Low Calorie.',
                m2_q: 'Paano makita ang sangkap at paraan ng pagluluto?',
                m2_a: 'Pindutin ang recipe card. Lalabas ang larawan, mga sangkap, at paraan ng pagluluto. Puwede mo ring pindutin ang ulam sa kalendaryo para makita ito.',
                m3_q: 'Paano maglagay ng ulam sa kalendaryo?',
                m3_a: 'Pindutin ang "Idagdag sa Kalendaryo" sa recipe card, o pindutin ang kahit anong kahon sa kalendaryo. Piliin ang araw at oras ng pagkain, tapos i-save.',
                m4_q: 'Paano mag-edit o magbura ng ulam sa kalendaryo?',
                m4_a: 'Gamitin ang lapis para mag-edit at ang X para magbura ng isang ulam. Ang "Burahin lahat" ay nagbubura ng buong kalendaryo.',
                m5_q: 'Paano gamitin ang KusinaAI Chef?',
                m5_a: 'Pindutin ang "KusinaAI Chef" sa kanang ibaba ng screen at magtanong tungkol sa pagluluto. Kapag humingi ka ng ulam para sa isang linggo, kusa itong ilalagay sa kalendaryo mo.',
                m6_q: 'Paano magpalit ng wika?',
                m6_a: 'Pindutin ang TL o EN sa taas ng pahina. Maaalala ang pinili mo sa susunod mong pagbisita.'
            },
            en: {
                nav_home: 'Home',
                page_title: 'My Account',
                page_sub: 'Your info, a how-to guide, and logout.',
                joined: 'Member since {date}',
                stat_dishes: 'Dishes planned', stat_days: 'Days planned',
                logout: 'Log out',
                confirm_logout: 'Are you sure you want to log out?',
                about_title: 'About KusinaAI',
                about_p: 'KusinaAI is a digital cookbook and meal planner for Filipino cooking. Find recipes, plan your meals for the whole week, and ask the AI Chef anytime.',
                about_f1: 'A cookbook of Filipino recipes',
                about_f2: 'A weekly meal calendar',
                about_f3: 'An AI Chef that answers your questions',
                about_f4: 'Tagalog and English',
                manual_title: 'User Manual',
                m1_q: 'How do I search for a recipe?',
                m1_a: 'On the home page, type a dish or ingredient in the search box and press Search. You can also tap the quick buttons such as Adobo, Vegetables, Healthy, or Low Calorie.',
                m2_q: 'How do I see the ingredients and instructions?',
                m2_a: 'Click a recipe card to see its photo, ingredients, and cooking instructions. You can also click a dish in the calendar to view it.',
                m3_q: 'How do I add a dish to the calendar?',
                m3_a: 'Press "Add to Calendar" on a recipe card, or click any box in the calendar. Choose the day and mealtime, then save.',
                m4_q: 'How do I edit or delete a dish in the calendar?',
                m4_a: 'Use the pencil to edit and the X to delete a single dish. "Clear all" removes everything from the calendar.',
                m5_q: 'How do I use the KusinaAI Chef?',
                m5_a: 'Press "KusinaAI Chef" at the bottom right of the screen and ask anything about cooking. If you ask for a meal plan for a week, it is added to your calendar automatically.',
                m6_q: 'How do I change the language?',
                m6_a: 'Press TL or EN at the top of the page. Your choice is remembered the next time you visit.'
            }
        };

        let lang = 'tl';
        try { lang = localStorage.getItem('kusina_lang') === 'en' ? 'en' : 'tl'; } catch (e) {}

        function t(key, vars) {
            let s = (I18N[lang] && I18N[lang][key]) || I18N.tl[key] || key;
            if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
            return s;
        }

        function initials(name) {
            const p = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (!p.length) return '?';
            return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
        }

        function fillProfile() {
            document.getElementById('avatar').textContent = initials(USER.name || USER.email);
            document.getElementById('uName').textContent = USER.name || '';
            document.getElementById('uEmail').textContent = USER.email || '';
            const d = USER.joined ? new Date(USER.joined) : null;
            const box = document.getElementById('uJoined');
            if (d && !isNaN(d)) {
                const txt = d.toLocaleDateString(lang === 'en' ? 'en-US' : 'fil-PH', { year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('uJoinedText').textContent = t('joined', { date: txt });
                box.style.display = 'inline-flex';
            } else {
                box.style.display = 'none';
            }
        }

        function applyLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.getElementById('lang-tl').classList.toggle('active', lang === 'tl');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            fillProfile();
        }

        function setLang(l) {
            if (l === lang) return;
            lang = l;
            try { localStorage.setItem('kusina_lang', l); } catch (e) {}
            applyLang();
        }

        function confirmLogout() { return confirm(t('confirm_logout')); }

        async function loadStats() {
            try {
                const res = await fetch('/api/plan');
                const data = await res.json();
                const plan = data.plan || {};
                let dishes = 0, daysWith = 0;
                Object.keys(plan).forEach(day => {
                    const vals = Object.values(plan[day] || {}).filter(v => v && v !== '-');
                    dishes += vals.length;
                    if (vals.length) daysWith++;
                });
                document.getElementById('statDishes').textContent = dishes;
                document.getElementById('statDays').textContent = daysWith;
            } catch (e) {}
        }

        applyLang();
        loadStats();
    </script>
</body>
</html>
