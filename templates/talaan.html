<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KusinaAI - Talaan ng mga Ulam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: #fff7ed;
            --primary-soft: #ffedd5;
            --bg-main: #fffaf5;
            --ink: #1c1917;
            --text-muted: #78716c;
            --border-color: #ece7e2;
            --radius-xl: 24px;
            --shadow-sm: 0 1px 2px rgba(28,25,23,.04), 0 2px 8px rgba(28,25,23,.04);
            --shadow-md: 0 18px 40px -12px rgba(249,115,22,.28);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-main); color: var(--ink); line-height: 1.55; padding-bottom: 100px; }

        /* ---------- NAVBAR ---------- */
        .navbar {
            background: rgba(255,250,245,.85); backdrop-filter: blur(14px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color);
            padding: .85rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; color: var(--ink); text-decoration: none; }
        .brand .mark {
            width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-size: .95rem;
            box-shadow: 0 6px 14px rgba(249,115,22,.35);
        }
        .brand b { color: var(--primary-dark); }
        .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-nav {
            background: var(--primary-light); color: var(--primary-dark); border: 1.5px solid #fed7aa; padding: .5rem 1.1rem;
            border-radius: 30px; font-weight: 700; cursor: pointer; font-size: .85rem; text-decoration: none;
            display: flex; align-items: center; gap: 8px; transition: .2s;
        }
        .btn-nav i, .btn-logout i, .modal-section h4 i { font-style: normal; }
        .btn-nav:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-1px); }
        .btn-logout {
            background: #fff; color: #b91c1c; border: 1.5px solid #fecaca; padding: .5rem 1.1rem;
            border-radius: 30px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: .85rem;
            display: flex; align-items: center; gap: 8px; transition: .2s;
        }
        .btn-logout:hover { background: #ef4444; color: #fff; border-color: #ef4444; transform: translateY(-1px); }
        .lang-switch { display: flex; background: #fff; border: 1.5px solid #fed7aa; border-radius: 30px; padding: 3px; }
        .lang-switch button {
            border: none; background: transparent; color: var(--text-muted); font-weight: 800; font-size: .78rem;
            padding: 5px 12px; border-radius: 30px; cursor: pointer; transition: .2s;
        }
        .lang-switch button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 10px rgba(249,115,22,.3); }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }

        /* ---------- HERO ---------- */
        .hero {
            position: relative; overflow: hidden; color: #fff; text-align: center;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #9a3412 100%);
            padding: 2.6rem 2rem; border-radius: var(--radius-xl); margin-bottom: 1.6rem; box-shadow: var(--shadow-md);
        }
        .hero::before { content: ""; position: absolute; width: 300px; height: 300px; right: -90px; top: -120px; border-radius: 50%; background: rgba(255,255,255,.12); }
        .hero > * { position: relative; z-index: 1; }
        .hero h1 { font-family: 'Fraunces', serif; font-size: 2.3rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .4rem; }
        .hero p { color: rgba(255,255,255,.9); }
        .hero .stats { display: inline-flex; gap: 10px; margin-top: 1rem; flex-wrap: wrap; justify-content: center; }
        .hero .stats span { background: rgba(255,255,255,.18); padding: 5px 14px; border-radius: 30px; font-size: .82rem; font-weight: 700; }

        /* ---------- TABS + CARDS ---------- */
        .idx-tabs { display: flex; gap: 8px; margin-bottom: 1.2rem; }
        .idx-tabs button {
            flex: 1; border: 1.5px solid #fed7aa; background: #fff; color: var(--primary-dark); font-weight: 800;
            padding: 11px; border-radius: 14px; cursor: pointer; transition: .2s; font-size: .92rem;
        }
        .idx-tabs button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border-color: var(--primary); box-shadow: 0 6px 16px rgba(249,115,22,.3); }
        .idx-card { background: #fff; border: 1px solid var(--border-color); border-radius: 20px; padding: 1.2rem 1.4rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm); }
        .idx-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: .7rem; }
        .idx-head b { font-family: 'Fraunces', serif; font-size: 1.2rem; }
        .idx-head span { font-size: .78rem; font-weight: 800; color: var(--primary-dark); background: var(--primary-soft); padding: 3px 11px; border-radius: 20px; white-space: nowrap; }
        .idx-row { display: flex; gap: 14px; padding: 9px 0; border-top: 1px dashed #e7e0d9; }
        .idx-date { width: 120px; flex-shrink: 0; font-weight: 800; font-size: .84rem; color: var(--text-muted); padding-top: 4px; }
        .idx-dishes { display: flex; flex-wrap: wrap; gap: 6px; }
        .idx-dish {
            display: inline-flex; align-items: center; gap: 6px; background: #fdf9f5; border: 1.5px solid #fed7aa;
            padding: 5px 12px; border-radius: 20px; font-size: .82rem; font-weight: 700; cursor: pointer; transition: .2s;
        }
        .idx-dish:hover { background: var(--primary-light); border-color: var(--primary); transform: translateY(-1px); }
        .idx-dish i { font-style: normal; font-size: .8rem; }
        .idx-dish em { font-style: normal; font-weight: 600; color: var(--text-muted); font-size: .72rem; }
        .idx-dish b { color: var(--primary-dark); }
        .idx-freq { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: .7rem; }
        .idx-empty { text-align: center; color: var(--text-muted); padding: 3rem 1rem; background: #fff; border: 1px dashed #fdba74; border-radius: 20px; }
        .idx-empty i { display: block; font-style: normal; font-size: 2.4rem; margin-bottom: 10px; }

        /* ---------- RECIPE MODAL ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(28,25,23,.55); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1001; padding: 1rem;
        }
        .modal-card {
            background: #fff; width: 100%; max-width: 540px; border-radius: 24px; padding: 1.6rem; position: relative;
            max-height: 88vh; overflow-y: auto; box-shadow: 0 30px 70px rgba(0,0,0,.3); animation: pop .25s ease;
        }
        @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
        .modal-img { width: 100%; height: 230px; object-fit: cover; border-radius: 16px; margin-bottom: 1.1rem; background: #fed7aa; display: block; }
        .close-modal {
            position: absolute; top: 14px; right: 14px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,.95); color: var(--ink); display: grid; place-items: center;
            cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15); transition: .2s;
        }
        .close-modal:hover { background: var(--primary); color: #fff; transform: rotate(90deg); }
        .modal-title { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 1rem; padding-right: 40px; }
        .modal-section { background: #fdf9f5; border: 1px solid var(--border-color); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: .9rem; }
        .modal-section h4 { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--primary-dark); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .modal-section p { color: #57534e; font-size: .92rem; white-space: pre-line; }

        /* ---------- CHAT ---------- */
        .chat-fab {
            position: fixed; bottom: 25px; right: 25px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #fff; border: none; padding: 14px 24px; border-radius: 50px; font-size: .95rem;
            font-weight: 800; cursor: pointer; box-shadow: 0 12px 28px rgba(249,115,22,.45);
            display: flex; align-items: center; gap: 10px; z-index: 99; transition: .2s;
        }
        .chat-fab:hover { transform: translateY(-3px) scale(1.02); }
        .chat-drawer {
            position: fixed; bottom: 92px; right: 25px; width: 390px; height: 520px; max-height: calc(100vh - 120px);
            background: #fff; border-radius: 22px; box-shadow: 0 24px 60px rgba(28,25,23,.25);
            border: 1px solid var(--border-color); display: none; flex-direction: column; z-index: 1000; overflow: hidden;
            animation: pop .25s ease;
        }
        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
            padding: 1rem 1.1rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center;
        }
        .chat-header .who { display: flex; align-items: center; gap: 10px; }
        .chat-header .avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: .95rem; }
        .chat-header small { display: block; font-weight: 500; font-size: .72rem; opacity: .85; }
        .chat-close { cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; transition: .2s; }
        .chat-close:hover { background: rgba(255,255,255,.2); }
        .chat-body { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fdf9f5; }
        .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: .9rem; line-height: 1.5; word-break: break-word; }
        .chat-msg.user { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-msg.ai { background: #fff; color: var(--ink); align-self: flex-start; border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
        .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
        .typing span { width: 7px; height: 7px; background: #fdba74; border-radius: 50%; animation: bounce 1.1s infinite; }
        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
        .chat-footer { padding: 12px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; background: #fff; }
        .chat-footer input { flex: 1; min-width: 0; border: 1.5px solid var(--border-color); border-radius: 24px; padding: 10px 16px; outline: none; font-size: .9rem; transition: .2s; }
        .chat-footer input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
        .chat-footer button { background: var(--primary); color: #fff; border: none; padding: 0 18px; border-radius: 24px; font-weight: 700; cursor: pointer; transition: .2s; }
        .chat-footer button:hover { background: var(--primary-dark); }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); opacity: 0;
            background: #1c1917; color: #fff; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: .9rem;
            z-index: 2000; box-shadow: 0 16px 40px rgba(0,0,0,.3); transition: .3s; pointer-events: none;
            display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast i { font-style: normal; color: #fb923c; }

        @media (max-width: 700px) {
            .navbar { padding: .75rem 1rem; }
            .nav-actions { gap: 6px; }
            .container { padding: 0 1rem; margin-top: 1.2rem; }
            .hero { padding: 2rem 1.1rem; border-radius: 20px; }
            .hero h1 { font-size: 1.8rem; }
            .idx-row { flex-direction: column; gap: 4px; }
            .idx-date { width: auto; }
            .chat-drawer { right: 12px; left: 12px; width: auto; bottom: 86px; }
            .chat-fab { right: 14px; bottom: 16px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/" class="brand"><div class="mark">🍴</div> Kusina<b>AI</b></a>
        <div class="nav-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <button id="lang-tl" onclick="setLang('tl')">TL</button>
                <button id="lang-en" onclick="setLang('en')">EN</button>
            </div>
            <a href="/" class="btn-nav"><i>🏠</i> <span data-i18n="nav_home"></span></a>
            <a href="/logout" class="btn-logout"><i>🚪</i> <span data-i18n="logout"></span></a>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1 data-i18n="idx_title"></h1>
            <p data-i18n="idx_sub"></p>
            <div class="stats" id="idxStats"></div>
        </div>

        <div class="idx-tabs">
            <button id="idxTabWeek" onclick="setIdxView('week')" data-i18n="idx_week"></button>
            <button id="idxTabMonth" onclick="setIdxView('month')" data-i18n="idx_month"></button>
        </div>
        <div id="idxBody"></div>
    </div>

    <!-- CHAT FAB -->
    <button class="chat-fab" onclick="toggleChat()"><span>🤖</span> KusinaAI Chef</button>

    <!-- CHAT DRAWER -->
    <div class="chat-drawer" id="chatDrawer">
        <div class="chat-header">
            <div class="who">
                <div class="avatar">🤖</div>
                <div>KusinaAI Chef Assistant<small data-i18n="chat_sub"></small></div>
            </div>
            <div class="chat-close" onclick="toggleChat()">✕</div>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-msg ai" data-i18n="chat_welcome"></div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" data-i18n-ph="chat_ph" onkeypress="handleKeyPress(event)">
            <button onclick="sendChatMessage()">➤</button>
        </div>
    </div>

    <!-- RECIPE MODAL -->
    <div class="modal-overlay" id="recipeModal" onclick="if(event.target===this) closeModal('recipeModal')">
        <div class="modal-card">
            <div class="close-modal" onclick="closeModal('recipeModal')">✕</div>
            <img id="modalImage" class="modal-img" src="" alt="Recipe Image" onerror="this.style.display='none'">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div class="modal-section">
                <h4><i>🧺</i> <span data-i18n="ingredients"></span></h4>
                <p id="modalIngredients"></p>
            </div>
            <div class="modal-section">
                <h4><i>🍳</i> <span data-i18n="instructions"></span></h4>
                <p id="modalInstructions"></p>
            </div>
        </div>
    </div>

    <script>
        const days = ['Lunes', 'Martes', 'Miyerkules', 'Huwebes', 'Biyernes', 'Sabado', 'Linggo'];
        const meals = ['Almusal', 'Tanghalian', 'Hapunan'];
        const MEAL_EN = { Almusal: 'Breakfast', Tanghalian: 'Lunch', Hapunan: 'Dinner' };
        const mealIcons = { 'Almusal': '☕', 'Tanghalian': '☀️', 'Hapunan': '🌙' };

        const I18N = {
            tl: {
                logout: 'Logout', nav_home: 'Home',
                idx_title: 'Talaan ng mga Ulam',
                idx_sub: 'Lahat ng ulam na nailagay mo sa kalendaryo, bawat linggo at buwan.',
                idx_week: 'Bawat Linggo', idx_month: 'Bawat Buwan',
                idx_empty: 'Wala pang ulam sa talaan. Maglagay ng ulam sa kalendaryo para lumabas dito.',
                idx_loading: 'Kinukuha ang talaan...', idx_total: '{n} ulam',
                idx_stats_dishes: '{n} ulam', idx_stats_weeks: '{n} linggo',
                idx_norecipe: 'Walang resipe sa cookbook para sa ulam na ito.',
                ingredients: 'Mga Sangkap', instructions: 'Paraan ng Pagluluto',
                no_ingredients: 'Walang nakalagay na sangkap.', no_instructions: 'Walang nakalagay na paraan ng pagluluto.',
                chat_sub: 'Handang sumagot sa tanong mo',
                chat_welcome: 'Mabuhay! Ako ang iyong KusinaAI Chef. Magtanong ng kahit ano tungkol sa pagkain!',
                chat_ph: 'Magtanong ukol sa ulam...',
                err_conn: 'Pasensya na, may problema sa koneksyon.',
                toast_plan: 'Nailagay na sa Kalendaryo ang ulam!',
                toast_savefail: 'Hindi na-save ang pagbabago. Subukan ulit.'
            },
            en: {
                logout: 'Logout', nav_home: 'Home',
                idx_title: 'Meal History',
                idx_sub: 'Every dish you put on the calendar, by week and by month.',
                idx_week: 'By Week', idx_month: 'By Month',
                idx_empty: 'No dishes yet. Add a dish to the calendar and it will show up here.',
                idx_loading: 'Loading...', idx_total: '{n} dishes',
                idx_stats_dishes: '{n} dishes', idx_stats_weeks: '{n} weeks',
                idx_norecipe: 'No cookbook recipe found for this dish.',
                ingredients: 'Ingredients', instructions: 'Instructions',
                no_ingredients: 'No ingredients listed.', no_instructions: 'No instructions listed.',
                chat_sub: 'Ready to answer your questions',
                chat_welcome: "Hello! I'm your KusinaAI Chef. Ask me anything about food!",
                chat_ph: 'Ask about a dish...',
                err_conn: 'Sorry, there is a connection problem.',
                toast_plan: 'The dish is now in your calendar!',
                toast_savefail: "Couldn't save the change. Please try again."
            }
        };

        let lang = 'tl';
        try { lang = localStorage.getItem('kusina_lang') === 'en' ? 'en' : 'tl'; } catch (e) {}

        function t(key, vars) {
            let s = (I18N[lang] && I18N[lang][key]) || I18N.tl[key] || key;
            if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
            return s;
        }
        function mealLabel(m) { return lang === 'en' ? (MEAL_EN[m] || m) : m; }
        function esc(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function applyStaticLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            document.getElementById('lang-tl').classList.toggle('active', lang === 'tl');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        }

        function setLang(l) {
            if (l === lang) return;
            lang = l;
            try { localStorage.setItem('kusina_lang', l); } catch (e) {}
            applyStaticLang();
            renderIndex();
            if (document.getElementById('recipeModal').style.display === 'flex' && modalRecipe) showRecipe(modalRecipe);
        }

        // ---------- Salin ng mga ulam sa English (AI + cache, kapareho ng main page) ----------
        const TR_MEM = {};
        function trGet(target, s) {
            const k = 'kt:' + target + ':' + s;
            if (k in TR_MEM) return TR_MEM[k];
            try { const c = localStorage.getItem(k); if (c !== null) { TR_MEM[k] = c; return c; } } catch (e) {}
            return null;
        }
        function trSet(target, s, v, persist) {
            const k = 'kt:' + target + ':' + s;
            TR_MEM[k] = v;
            if (persist) { try { localStorage.setItem(k, v); } catch (e) {} }
        }
        async function trBatch(texts, target) {
            const src = texts.map(s => String(s == null ? '' : s).trim());
            const miss = [];
            src.forEach(s => { if (s && trGet(target, s) === null && !miss.includes(s)) miss.push(s); });
            for (let k = 0; k < miss.length; k += 20) {
                const chunk = miss.slice(k, k + 20);
                let ok = false;
                try {
                    const r = await fetch('/api/translate_batch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ texts: chunk, target: target })
                    });
                    const d = await r.json();
                    if (d.ok && Array.isArray(d.translations) && d.translations.length === chunk.length) {
                        chunk.forEach((s, j) => trSet(target, s, String(d.translations[j] || s), true));
                        ok = true;
                    }
                } catch (e) {}
                if (!ok) chunk.forEach(s => trSet(target, s, s, false));
            }
            return src.map(s => { if (!s) return ''; const c = trGet(target, s); return c !== null ? c : s; });
        }

        // ---------- DATA ----------
        let idxView = 'week', idxWeeks = [], modalRecipe = null;
        let chatHistory = [];

        document.addEventListener('DOMContentLoaded', async () => {
            applyStaticLang();
            document.getElementById('idxBody').innerHTML = '<div class="idx-empty">' + esc(t('idx_loading')) + '</div>';
            document.getElementById('idxBody').addEventListener('click', e => {
                const el = e.target.closest('[data-dish]');
                if (el) openDishByName(el.dataset.dish);
            });
            await loadHistory();
        });

        async function loadHistory() {
            try {
                const r = await fetch('/api/history');
                idxWeeks = (await r.json()).weeks || [];
            } catch (e) { idxWeeks = []; }
            renderIndex();
        }

        function setIdxView(v) { idxView = v; renderIndex(); }

        function idxDate(startIso, i) {
            const [y, m, d] = startIso.split('-').map(Number);
            return new Date(y, m - 1, d + i);
        }
        function fmtDate(dt, opts) { return dt.toLocaleDateString(lang === 'en' ? 'en-US' : 'fil-PH', opts); }

        function planEntries(week) {
            const out = [];
            days.forEach((day, di) => meals.forEach(meal => {
                const v = week.plan && week.plan[day] && week.plan[day][meal];
                if (v && v !== '-') out.push({ date: idxDate(week.start, di), day: day, meal: meal, dish: v });
            }));
            return out;
        }

        function dishChip(it) {
            return `<span class="idx-dish" data-dish="${esc(it.dish)}"><i>${mealIcons[it.meal]}</i> <em>${esc(mealLabel(it.meal))}</em> <span class="idx-name">${esc(it.dish)}</span></span>`;
        }

        function dayRows(items) {
            const byDate = {};
            items.forEach(it => { const k = it.date.getTime(); (byDate[k] = byDate[k] || []).push(it); });
            return Object.keys(byDate).map(Number).sort((a, b) => a - b).map(k => {
                const its = byDate[k];
                return `<div class="idx-row"><div class="idx-date">${esc(fmtDate(its[0].date, { weekday: 'short', month: 'short', day: 'numeric' }))}</div>
                        <div class="idx-dishes">${its.map(dishChip).join('')}</div></div>`;
            }).join('');
        }

        function renderIndex() {
            document.getElementById('idxTabWeek').classList.toggle('active', idxView === 'week');
            document.getElementById('idxTabMonth').classList.toggle('active', idxView === 'month');
            const body = document.getElementById('idxBody');
            const weeks = idxWeeks.map(w => ({ w: w, items: planEntries(w) })).filter(x => x.items.length);

            const total = weeks.reduce((n, x) => n + x.items.length, 0);
            document.getElementById('idxStats').innerHTML = weeks.length
                ? `<span>🍲 ${esc(t('idx_stats_dishes', { n: total }))}</span><span>📆 ${esc(t('idx_stats_weeks', { n: weeks.length }))}</span>`
                : '';

            if (!weeks.length) {
                body.innerHTML = '<div class="idx-empty"><i>📭</i>' + esc(t('idx_empty')) + '</div>';
                return;
            }

            if (idxView === 'week') {
                body.innerHTML = weeks.map(({ w, items }) => {
                    const range = fmtDate(idxDate(w.start, 0), { month: 'short', day: 'numeric' }) + ' – ' +
                                  fmtDate(idxDate(w.start, 6), { month: 'short', day: 'numeric', year: 'numeric' });
                    return `<div class="idx-card"><div class="idx-head"><b>${esc(range)}</b><span>${esc(t('idx_total', { n: items.length }))}</span></div>${dayRows(items)}</div>`;
                }).join('');
            } else {
                const months = {};
                weeks.forEach(({ items }) => items.forEach(it => {
                    const k = it.date.getFullYear() * 100 + it.date.getMonth();
                    (months[k] = months[k] || []).push(it);
                }));
                body.innerHTML = Object.keys(months).map(Number).sort((a, b) => b - a).map(k => {
                    const items = months[k];
                    const counts = {};
                    items.forEach(it => { counts[it.dish] = (counts[it.dish] || 0) + 1; });
                    const freq = Object.keys(counts).sort((a, b) => counts[b] - counts[a])
                        .map(d => `<span class="idx-dish" data-dish="${esc(d)}"><span class="idx-name">${esc(d)}</span> <b>×${counts[d]}</b></span>`).join('');
                    const title = fmtDate(items[0].date, { month: 'long', year: 'numeric' });
                    return `<div class="idx-card"><div class="idx-head"><b>${esc(title)}</b><span>${esc(t('idx_total', { n: items.length }))}</span></div>
                            <div class="idx-freq">${freq}</div>${dayRows(items)}</div>`;
                }).join('');
            }
            translateIndex();
        }

        async function translateIndex() {
            const L = lang;
            if (L !== 'en') return;
            const els = Array.from(document.querySelectorAll('#idxBody .idx-dish[data-dish]'));
            const raws = Array.from(new Set(els.map(e => e.dataset.dish)));
            if (!raws.length) return;
            const out = await trBatch(raws, L);
            if (L !== lang) return;
            const map = {};
            raws.forEach((r, i) => { map[r] = out[i]; });
            document.querySelectorAll('#idxBody .idx-dish[data-dish]').forEach(e => {
                const n = e.querySelector('.idx-name');
                if (n) n.textContent = map[e.dataset.dish] || e.dataset.dish;
            });
        }

        // ---------- RESIPE ----------
        async function openDishByName(name) {
            try {
                const r = await fetch('/api/recipe_lookup?title=' + encodeURIComponent(name));
                const d = await r.json();
                if (d.recipe) return showRecipe(d.recipe);
            } catch (e) {}
            showToast(t('idx_norecipe'));
        }

        async function showRecipe(r) {
            if (!r) return;
            modalRecipe = r;
            const L = lang;
            const fix = s => String(s || '').replace(/\\n/g, '\n');
            document.getElementById('modalTitle').innerText = r.title;
            document.getElementById('modalIngredients').innerText = r.ingredients || t('no_ingredients');
            document.getElementById('modalInstructions').innerText = fix(r.instructions) || t('no_instructions');
            const mImg = document.getElementById('modalImage');
            if (r.image_url) {
                mImg.style.display = 'block';
                mImg.src = r.image_url;
            } else {
                mImg.style.display = 'none';
                mImg.removeAttribute('src');
                fetch('/api/dish_image?title=' + encodeURIComponent(r.title)).then(x => x.json()).then(d => {
                    if (d.url) { r.image_url = d.url; if (modalRecipe === r) { mImg.src = d.url; mImg.style.display = 'block'; } }
                }).catch(() => {});
            }
            document.getElementById('recipeModal').style.display = 'flex';

            if (L !== 'en') return;
            const out = await trBatch([r.title, r.ingredients, fix(r.instructions)], L);
            if (L !== lang || modalRecipe !== r) return;
            if (out[0]) document.getElementById('modalTitle').innerText = out[0];
            if (out[1]) document.getElementById('modalIngredients').innerText = out[1];
            if (out[2]) document.getElementById('modalInstructions').innerText = out[2];
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function showToast(msg) {
            let el = document.getElementById('toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast';
                el.className = 'toast';
                document.body.appendChild(el);
            }
            el.innerHTML = '<i>✔</i><span></span>';
            el.querySelector('span').textContent = msg;
            requestAnimationFrame(() => el.classList.add('show'));
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => el.classList.remove('show'), 3500);
        }

        // ---------- AI CHAT ----------
        function toggleChat() {
            const drawer = document.getElementById('chatDrawer');
            drawer.style.display = (drawer.style.display === 'flex') ? 'none' : 'flex';
            if (drawer.style.display === 'flex') document.getElementById('chatInput').focus();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function formatReply(s) {
            return esc(s)
                .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');
        }

        // Kapag nagbigay ang AI ng plano, idagdag sa kalendaryo, i-save, at i-refresh ang talaan.
        async function applyAiPlan(plan) {
            let cur = {};
            try { cur = (await (await fetch('/api/plan')).json()).plan || {}; } catch (e) {}
            for (const day of Object.keys(plan)) {
                if (!days.includes(day)) continue;
                if (!cur[day]) cur[day] = {};
                for (const meal of meals) {
                    if (plan[day][meal]) cur[day][meal] = plan[day][meal];
                }
            }
            try {
                await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan: cur })
                });
                showToast(t('toast_plan'));
                await loadHistory();
            } catch (e) {
                showToast(t('toast_savefail'));
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if (!txt) return;

            const chatBody = document.getElementById('chatBody');
            chatBody.insertAdjacentHTML('beforeend', `<div class="chat-msg user">${esc(txt)}</div>`);
            input.value = '';
            chatBody.insertAdjacentHTML('beforeend', `<div class="chat-msg ai" id="typingMsg"><div class="typing"><span></span><span></span><span></span></div></div>`);
            chatBody.scrollTop = chatBody.scrollHeight;

            const hist = chatHistory.slice(-6);
            chatHistory.push({ role: 'user', text: txt });

            let reply;
            try {
                const res = await fetch('/ask_ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: txt, lang: lang, history: hist })
                });
                const data = await res.json();
                reply = data.reply;
                if (data.plan) applyAiPlan(data.plan);
            } catch (e) {
                reply = t('err_conn');
            }
            chatHistory.push({ role: 'ai', text: reply });
            const typing = document.getElementById('typingMsg');
            if (typing) typing.remove();
            chatBody.insertAdjacentHTML('beforeend', `<div class="chat-msg ai">${formatReply(reply)}</div>`);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
