<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KusinaAI - Digital Cookbook & Meal Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-deep: #9a3412;
            --primary-light: #fff7ed;
            --primary-soft: #ffedd5;
            --bg-main: #fffaf5;
            --card-bg: #ffffff;
            --ink: #1c1917;
            --text-muted: #78716c;
            --border-color: #ece7e2;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 2px rgba(28,25,23,.04), 0 2px 8px rgba(28,25,23,.04);
            --shadow-md: 0 18px 40px -12px rgba(249,115,22,.28);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-main); color: var(--ink); line-height: 1.55; padding-bottom: 100px; }

        /* ---------- NAVBAR ---------- */
        .navbar {
            background: rgba(255,250,245,.85); backdrop-filter: blur(14px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: .85rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; color: var(--ink); }
        .brand .mark {
            width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-size: .95rem;
            box-shadow: 0 6px 14px rgba(249,115,22,.35);
        }
        .brand b { color: var(--primary-dark); }
        .btn-logout {
            background: #fff; color: #b91c1c; border: 1.5px solid #fecaca; padding: .5rem 1.1rem;
            border-radius: 30px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: .85rem;
            display: flex; align-items: center; gap: 8px; transition: .2s;
        }
        .btn-logout:hover { background: #ef4444; color: #fff; border-color: #ef4444; transform: translateY(-1px); }

        .container { max-width: 1280px; margin: 2rem auto; padding: 0 1.5rem; }

        /* ---------- HERO / SEARCH ---------- */
        .search-section {
            position: relative; overflow: hidden; text-align: center; color: #fff;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #9a3412 100%);
            padding: 3.5rem 2rem; border-radius: var(--radius-xl); margin-bottom: 2.5rem;
            box-shadow: var(--shadow-md);
        }
        .search-section::before, .search-section::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; }
        .search-section::before { width: 340px; height: 340px; right: -90px; top: -130px; background: rgba(255,255,255,.12); }
        .search-section::after { width: 260px; height: 260px; left: -80px; bottom: -120px; background: rgba(0,0,0,.14); }
        .search-section > * { position: relative; z-index: 1; }
        .hero-eyebrow {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.18);
            padding: 6px 14px; border-radius: 30px; font-size: .8rem; font-weight: 700; margin-bottom: 1rem;
        }
        .search-section h1 {
            font-family: 'Fraunces', serif; font-size: 2.7rem; font-weight: 800; line-height: 1.1;
            letter-spacing: -.02em; margin-bottom: .6rem;
        }
        .search-section p { color: rgba(255,255,255,.9); margin-bottom: 1.8rem; font-size: 1.02rem; }
        .search-box {
            max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
            background: #fff; padding: 6px; border-radius: 50px;
            box-shadow: 0 16px 34px rgba(0,0,0,.2);
        }
        .search-box .s-icon { color: #a8a29e; padding-left: 18px; }
        .search-box input { flex: 1; min-width: 0; border: none; outline: none; padding: .85rem .6rem; font-size: 1rem; border-radius: 50px; color: var(--ink); }
        .search-box button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none;
            padding: .85rem 1.7rem; border-radius: 50px; font-weight: 800; cursor: pointer; transition: .2s;
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .search-box button:hover { transform: scale(1.03); }
        .quick-chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 1.2rem; }
        .quick-chips button {
            background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.35);
            padding: 6px 14px; border-radius: 30px; font-size: .82rem; font-weight: 600; cursor: pointer; transition: .2s;
        }
        .quick-chips button:hover { background: #fff; color: var(--primary-dark); }

        /* ---------- SECTION HEADERS ---------- */
        .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.3rem; }
        .section-header .s-ico {
            width: 42px; height: 42px; border-radius: 14px; background: var(--primary-soft); color: var(--primary-dark);
            display: grid; place-items: center; font-size: 1.05rem;
        }
        .section-header h2 { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; }
        .section-header .count { margin-left: auto; font-size: .85rem; font-weight: 700; color: var(--text-muted); }

        /* ---------- CALENDAR ---------- */
        .calendar-card {
            background: #fff; border-radius: var(--radius-xl); padding: 1.8rem;
            border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); margin-bottom: 3rem;
        }
        .calendar-card > .hint { color: var(--text-muted); font-size: .9rem; margin: -.4rem 0 0 54px; }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr));
            gap: .9rem; margin-top: 1.4rem; overflow-x: auto; padding-bottom: 6px;
        }
        .day-column { background: #fdf9f5; border-radius: var(--radius-lg); padding: .8rem; border: 1px solid var(--border-color); }
        .day-column.today { background: var(--primary-light); border-color: #fdba74; box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
        .day-title {
            font-weight: 800; font-size: .92rem; color: var(--primary-dark); text-align: center;
            margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        .today-badge { background: var(--primary); color: #fff; font-size: .6rem; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: .04em; }
        .meal-slot {
            position: relative; background: #fff; border: 1.5px dashed #d6d3d1; border-radius: 12px;
            padding: 9px 10px; margin-bottom: 8px; cursor: pointer; transition: .2s;
        }
        .meal-slot:last-child { margin-bottom: 0; }
        .meal-slot:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
        .meal-slot.filled { border: 1.5px solid #fed7aa; background: linear-gradient(135deg, #fff, #fff7ed); }
        .meal-slot.filled .slot-value { padding-right: 22px; }
        .slot-label { font-size: .64rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
        .slot-label i { color: var(--primary); font-size: .7rem; }
        .slot-value { font-size: .85rem; font-weight: 700; color: var(--ink); margin-top: 3px; word-break: break-word; }
        .slot-value.empty { color: #d6d3d1; font-weight: 600; }
        .slot-del {
            position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
            border: none; background: #fee2e2; color: #b91c1c; font-size: .7rem; cursor: pointer;
            display: grid; place-items: center; transition: .2s;
        }
        .slot-del:hover { background: #ef4444; color: #fff; transform: scale(1.1); }
        .btn-danger-soft {
            margin-left: auto; background: #fff; color: #b91c1c; border: 1.5px solid #fecaca; padding: .45rem 1rem;
            border-radius: 30px; font-weight: 700; font-size: .8rem; cursor: pointer; transition: .2s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-danger-soft:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        /* ---------- RECIPES ---------- */
        .recipe-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem; margin-bottom: 3rem;
        }
        .recipe-card {
            background: var(--card-bg); border-radius: var(--radius-lg); overflow: hidden;
            border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
            transition: all .3s ease; cursor: pointer; display: flex; flex-direction: column;
        }
        .recipe-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); border-color: #fdba74; }
        .img-wrap { position: relative; height: 190px; overflow: hidden; background: linear-gradient(135deg, #fed7aa, #fdba74); }
        .recipe-img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; display: block; }
        .recipe-card:hover .recipe-img { transform: scale(1.08); }
        .img-ph {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; padding: 1rem; text-align: center; color: #9a3412; font-weight: 700; font-size: .9rem;
            background: linear-gradient(135deg, #ffedd5, #fed7aa);
        }
        .img-ph i { font-size: 2.2rem; opacity: .7; }
        .img-wrap::after { content: ""; position: absolute; inset: auto 0 0 0; height: 60%; background: linear-gradient(180deg, transparent, rgba(0,0,0,.45)); pointer-events: none; }
        .kcal-badge {
            position: absolute; left: 12px; bottom: 12px; z-index: 1; color: #fff; font-weight: 700; font-size: .78rem;
            display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
            padding: 4px 10px; border-radius: 20px;
        }
        .recipe-content { padding: 1.1rem 1.25rem 1.3rem; flex: 1; display: flex; flex-direction: column; }
        .recipe-tag {
            display: inline-block; background: var(--primary-light); color: var(--primary-dark);
            font-size: .72rem; font-weight: 800; padding: 4px 11px; border-radius: 20px;
            width: fit-content; margin-bottom: 9px; text-transform: uppercase; letter-spacing: .04em;
        }
        .recipe-title { font-size: 1.08rem; font-weight: 800; line-height: 1.3; }
        .recipe-cta { margin-top: auto; padding-top: 12px; color: var(--primary-dark); font-size: .82rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .recipe-card:hover .recipe-cta i { transform: translateX(4px); }
        .recipe-cta i { transition: .2s; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 3.5rem 1rem; color: var(--text-muted); }
        .empty-state i { font-size: 2.6rem; color: #fdba74; margin-bottom: 12px; display: block; }
        .empty-state b { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

        /* ---------- CHAT ---------- */
        .chat-fab {
            position: fixed; bottom: 25px; right: 25px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #fff; border: none; padding: 14px 24px; border-radius: 50px;
            font-weight: 800; cursor: pointer; box-shadow: 0 12px 28px rgba(249,115,22,.45);
            display: flex; align-items: center; gap: 10px; z-index: 99; transition: .2s;
        }
        .chat-fab:hover { transform: translateY(-3px) scale(1.02); }
        .chat-drawer {
            position: fixed; bottom: 92px; right: 25px; width: 390px; height: 520px; max-height: calc(100vh - 120px);
            background: #fff; border-radius: 22px; box-shadow: 0 24px 60px rgba(28,25,23,.25);
            border: 1px solid var(--border-color); display: none; flex-direction: column; z-index: 1000; overflow: hidden;
            animation: pop .25s ease;
        }
        @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
        .chat-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
            padding: 1rem 1.1rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center;
        }
        .chat-header .who { display: flex; align-items: center; gap: 10px; }
        .chat-header .avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: .9rem; }
        .chat-header small { display: block; font-weight: 500; font-size: .72rem; opacity: .85; }
        .chat-close { cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; transition: .2s; }
        .chat-close:hover { background: rgba(255,255,255,.2); }
        .chat-body { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fdf9f5; }
        .chat-msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: .9rem; line-height: 1.5; word-break: break-word; }
        .chat-msg.user { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-msg.ai { background: #fff; color: var(--ink); align-self: flex-start; border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
        .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
        .typing span { width: 7px; height: 7px; background: #fdba74; border-radius: 50%; animation: bounce 1.1s infinite; }
        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
        .chat-footer { padding: 12px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; background: #fff; }
        .chat-footer input { flex: 1; min-width: 0; border: 1.5px solid var(--border-color); border-radius: 24px; padding: 10px 16px; outline: none; font-size: .9rem; transition: .2s; }
        .chat-footer input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(249,115,22,.12); }
        .chat-footer button { background: var(--primary); color: #fff; border: none; padding: 0 18px; border-radius: 24px; font-weight: 700; cursor: pointer; transition: .2s; }
        .chat-footer button:hover { background: var(--primary-dark); }

        /* ---------- MODALS ---------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(28,25,23,.55); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1001; padding: 1rem;
        }
        .modal-card {
            background: #fff; width: 100%; max-width: 540px; border-radius: 24px;
            padding: 1.6rem; position: relative; max-height: 88vh; overflow-y: auto;
            box-shadow: 0 30px 70px rgba(0,0,0,.3); animation: pop .25s ease;
        }
        .modal-img { width: 100%; height: 230px; object-fit: cover; border-radius: 16px; margin-bottom: 1.1rem; background: #fed7aa; display: block; }
        .close-modal {
            position: absolute; top: 14px; right: 14px; z-index: 2; width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,.95); color: var(--ink); display: grid; place-items: center;
            cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.15); transition: .2s; font-size: 1rem;
        }
        .close-modal:hover { background: var(--primary); color: #fff; transform: rotate(90deg); }
        .modal-title { font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 1rem; }
        .modal-section { background: #fdf9f5; border: 1px solid var(--border-color); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: .9rem; }
        .modal-section h4 { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--primary-dark); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .modal-section p { color: #57534e; font-size: .92rem; white-space: pre-line; }

        .selector-title { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 800; color: var(--ink); margin-bottom: 2px; padding-right: 40px; }
        .selector-sub { color: var(--primary-dark); font-weight: 700; font-size: .85rem; margin-bottom: 1.2rem; }
        .field-label { font-weight: 700; font-size: .82rem; display: block; margin-bottom: 6px; color: #44403c; }
        .form-select, .form-input {
            width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border-color);
            font-size: .95rem; outline: none; margin-bottom: 14px; background: #fff; transition: .2s;
        }
        .form-select:focus, .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(249,115,22,.13); }
        .btn-primary {
            width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none;
            padding: 13px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: .95rem;
            box-shadow: 0 8px 20px rgba(249,115,22,.3); transition: .2s;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-clear { width: 100%; background: #f5f5f4; color: #57534e; border: none; padding: 11px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: .2s; }
        .btn-clear:hover { background: #fee2e2; color: #b91c1c; }

        /* ---------- NAV ACTIONS / LANGUAGE ---------- */
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .btn-nav {
            background: var(--primary-light); color: var(--primary-dark); border: 1.5px solid #fed7aa; padding: .5rem 1.1rem;
            border-radius: 30px; font-weight: 700; cursor: pointer; font-size: .85rem;
            display: flex; align-items: center; gap: 8px; transition: .2s;
        }
        .btn-nav:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-1px); }
        .lang-switch { display: flex; background: #fff; border: 1.5px solid #fed7aa; border-radius: 30px; padding: 3px; }
        .lang-switch button {
            border: none; background: transparent; color: var(--text-muted); font-weight: 800; font-size: .78rem;
            padding: 5px 12px; border-radius: 30px; cursor: pointer; transition: .2s;
        }
        .lang-switch button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 10px rgba(249,115,22,.3); }

        /* ---------- TRANSLATOR ---------- */
        .lang-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 1rem; }
        .lang-pill { flex: 1; text-align: center; background: var(--primary-light); color: var(--primary-dark); font-weight: 800; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #fed7aa; }
        .swap-btn {
            width: 42px; height: 42px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; cursor: pointer; transition: .3s; box-shadow: 0 6px 14px rgba(249,115,22,.35); flex-shrink: 0;
        }
        .swap-btn:hover { transform: rotate(180deg); }
        .tr-area { min-height: 120px; resize: vertical; line-height: 1.5; }
        .tr-result { margin-top: 1rem; background: #fdf9f5; border: 1px solid var(--border-color); border-radius: 14px; padding: 1rem 1.1rem; }
        .tr-result .tr-out { color: var(--ink); font-size: 1rem; font-weight: 600; white-space: pre-wrap; word-break: break-word; }
        .tr-result.error .tr-out { color: #b91c1c; }
        .btn-copy { margin-top: 10px; background: #fff; border: 1.5px solid var(--border-color); color: var(--primary-dark); font-weight: 700; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: .8rem; transition: .2s; }
        .btn-copy:hover { border-color: var(--primary); background: var(--primary-light); }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); opacity: 0;
            background: #1c1917; color: #fff; padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: .9rem;
            z-index: 2000; box-shadow: 0 16px 40px rgba(0,0,0,.3); transition: .3s; pointer-events: none;
            display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast i { color: #fb923c; }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            .navbar { padding: .75rem 1rem; }
            .nav-actions { gap: 6px; }
            .btn-nav span, .btn-danger-soft span, .btn-logout span { display: none; }
            .container { padding: 0 1rem; margin-top: 1.2rem; }
            .search-section { padding: 2.2rem 1.1rem; border-radius: 20px; }
            .search-section h1 { font-size: 1.9rem; }
            .search-box button span { display: none; }
            .search-box button { padding: .85rem 1.1rem; }
            .calendar-card { padding: 1.2rem; }
            .calendar-card > .hint { margin-left: 0; margin-top: .2rem; }
            .chat-drawer { right: 12px; left: 12px; width: auto; bottom: 86px; }
            .chat-fab { right: 14px; bottom: 16px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="brand"><div class="mark"><i class="fa-solid fa-utensils"></i></div> Kusina<b>AI</b></div>
        <div class="nav-actions">
            <div class="lang-switch" role="group" aria-label="Language">
                <button id="lang-tl" onclick="setLang('tl')">TL</button>
                <button id="lang-en" onclick="setLang('en')">EN</button>
            </div>
            <button class="btn-nav" onclick="openTranslator()"><i class="fa-solid fa-language"></i> <span data-i18n="nav_translator"></span></button>
            <a href="/logout" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="logout"></span></a>
        </div>
    </nav>

    <div class="container">
        <!-- SEARCH -->
        <div class="search-section">
            <div class="hero-eyebrow"><i class="fa-solid fa-sparkles"></i> Digital Cookbook &amp; Meal Planner</div>
            <h1 data-i18n="hero_title"></h1>
            <p data-i18n="hero_sub"></p>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass s-icon"></i>
                <input type="text" id="searchInput" data-i18n-ph="search_ph" onkeypress="if(event.key==='Enter') searchRecipes()">
                <button onclick="searchRecipes()"><i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="search_btn"></span></button>
            </div>
            <div class="quick-chips">
                <button onclick="quickSearch('Adobo')">Adobo</button>
                <button onclick="quickSearch('Sinigang')">Sinigang</button>
                <button onclick="quickSearch('Tinola')">Tinola</button>
                <button onclick="quickSearch('Sisig')">Sisig</button>
                <button onclick="quickSearch('Pancit')">Pancit</button>
            </div>
        </div>

        <!-- MEAL CALENDAR -->
        <div class="calendar-card">
            <div class="section-header">
                <div class="s-ico"><i class="fa-solid fa-calendar-days"></i></div>
                <h2 data-i18n="cal_title"></h2>
                <button class="btn-danger-soft" onclick="clearAllPlan()"><i class="fa-solid fa-trash-can"></i> <span data-i18n="clear_all"></span></button>
            </div>
            <p class="hint" data-i18n="cal_hint"></p>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- RECIPES -->
        <div class="section-header">
            <div class="s-ico"><i class="fa-solid fa-fire"></i></div>
            <h2 data-i18n="featured"></h2>
            <span class="count" id="recipeCount"></span>
        </div>
        <div class="recipe-grid" id="recipeGrid"></div>
    </div>

    <!-- CHAT FAB -->
    <button class="chat-fab" onclick="toggleChat()"><i class="fa-solid fa-robot"></i> KusinaAI Chef</button>

    <!-- CHAT DRAWER -->
    <div class="chat-drawer" id="chatDrawer">
        <div class="chat-header">
            <div class="who">
                <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                <div>KusinaAI Chef Assistant<small data-i18n="chat_sub"></small></div>
            </div>
            <div class="chat-close" onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-msg ai" data-i18n="chat_welcome"></div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" data-i18n-ph="chat_ph" onkeypress="handleKeyPress(event)">
            <button onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- RECIPE MODAL -->
    <div class="modal-overlay" id="recipeModal" onclick="if(event.target===this) closeModal('recipeModal')">
        <div class="modal-card">
            <div class="close-modal" onclick="closeModal('recipeModal')"><i class="fa-solid fa-xmark"></i></div>
            <img id="modalImage" class="modal-img" src="" alt="Recipe Image" onerror="this.style.display='none'">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div class="modal-section">
                <h4><i class="fa-solid fa-basket-shopping"></i> <span data-i18n="ingredients"></span></h4>
                <p id="modalIngredients"></p>
            </div>
            <div class="modal-section">
                <h4><i class="fa-solid fa-kitchen-set"></i> <span data-i18n="instructions"></span></h4>
                <p id="modalInstructions"></p>
            </div>
        </div>
    </div>

    <!-- MEAL SELECTOR MODAL -->
    <div class="modal-overlay" id="mealSelectorModal" onclick="if(event.target===this) closeModal('mealSelectorModal')">
        <div class="modal-card">
            <div class="close-modal" onclick="closeModal('mealSelectorModal')"><i class="fa-solid fa-xmark"></i></div>
            <h3 class="selector-title" id="selectorTitle"></h3>
            <p class="selector-sub" id="selectorSubtitle"></p>

            <label class="field-label" data-i18n="sel_cookbook"></label>
            <select class="form-select" id="recipeDropdown">
                <option value=""></option>
            </select>

            <label class="field-label" data-i18n="sel_custom"></label>
            <input type="text" class="form-input" id="customMealInput" data-i18n-ph="sel_custom_ph">

            <button class="btn-primary" onclick="confirmMealSelection()"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="sel_save"></span></button>
            <button class="btn-clear" onclick="clearMealSelection()" data-i18n="sel_clear"></button>
        </div>
    </div>

    <!-- TRANSLATOR MODAL -->
    <div class="modal-overlay" id="translatorModal" onclick="if(event.target===this) closeModal('translatorModal')">
        <div class="modal-card">
            <div class="close-modal" onclick="closeModal('translatorModal')"><i class="fa-solid fa-xmark"></i></div>
            <h3 class="selector-title" data-i18n="tr_title"></h3>
            <p class="selector-sub">English &harr; Tagalog</p>

            <div class="lang-bar">
                <span class="lang-pill" id="langFrom">English</span>
                <button class="swap-btn" onclick="swapLang()" aria-label="Swap"><i class="fa-solid fa-right-left"></i></button>
                <span class="lang-pill" id="langTo">Tagalog</span>
            </div>

            <textarea class="form-input tr-area" id="trInput" maxlength="1000" data-i18n-ph="tr_ph"
                      onkeydown="if(event.key==='Enter' && (event.ctrlKey || event.metaKey)) translateText()"></textarea>
            <button class="btn-primary" id="trBtn" onclick="translateText()"></button>

            <div class="tr-result" id="trResult" style="display:none;">
                <div class="tr-out" id="trOut"></div>
                <button class="btn-copy" id="trCopy" onclick="copyTranslation()"></button>
            </div>
        </div>
    </div>

    <script>
        const initialRecipes = {{ featured_recipes | tojson }};
        const days = ['Lunes', 'Martes', 'Miyerkules', 'Huwebes', 'Biyernes', 'Sabado', 'Linggo'];
        const meals = ['Almusal', 'Tanghalian', 'Hapunan'];
        const DAY_EN = { Lunes: 'Monday', Martes: 'Tuesday', Miyerkules: 'Wednesday', Huwebes: 'Thursday', Biyernes: 'Friday', Sabado: 'Saturday', Linggo: 'Sunday' };
        const MEAL_EN = { Almusal: 'Breakfast', Tanghalian: 'Lunch', Hapunan: 'Dinner' };
        const mealIcons = { 'Almusal': 'fa-mug-hot', 'Tanghalian': 'fa-sun', 'Hapunan': 'fa-moon' };

        let planData = {};
        let activeDay = '', activeMeal = '';
        let currentRecipes = [];
        let modalIdx = -1;

        // 0 = Lunes ... 6 = Linggo
        const todayIndex = (new Date().getDay() + 6) % 7;

        // ---------------------------------------------------------------
        // LANGUAGE (TL / EN) - buong website
        // ---------------------------------------------------------------
        const I18N = {
            tl: {
                nav_translator: 'Tagasalin', logout: 'Logout',
                hero_title: 'Ano ang gusto mong lutuin ngayon?',
                hero_sub: 'Maghanap ng higit sa libu-libong masasarap na resipeng Pinoy',
                search_ph: 'Halimbawa: Adobo, Sinigang, Tapsilog...', search_btn: 'Hanapin',
                cal_title: 'Kalendaryo ng Pagkain sa Linggo',
                cal_hint: 'Pumili ng araw at oras upang maglagay ng ulam.',
                clear_all: 'Burahin lahat',
                featured: 'Mga Tampok na Resipe', count: '{n} resipe',
                view_recipe: 'Tingnan ang resipe', dish: 'Ulam',
                no_results_title: 'Walang nahanap na resipe',
                no_results_sub: 'Subukan ang ibang salita, halimbawa "adobo" o "sinigang".',
                add: '+ Magdagdag', today: 'Ngayon', del: 'Burahin',
                chat_sub: 'Handang sumagot sa tanong mo',
                chat_welcome: 'Mabuhay! Ako ang iyong KusinaAI Chef. Magtanong ng kahit ano tungkol sa pagkain!',
                chat_ph: 'Magtanong ukol sa ulam...',
                ingredients: 'Mga Sangkap', instructions: 'Paraan ng Pagluluto',
                no_ingredients: 'Walang nakalagay na sangkap.', no_instructions: 'Walang nakalagay na paraan ng pagluluto.',
                sel_title: 'Pumili ng Ulam para sa {day}', sel_sub: 'Oras: {meal}',
                sel_cookbook: 'Pumili sa Cookbook:', sel_dropdown: '-- Pumili mula sa Cookbook --',
                sel_custom: 'O Mag-type ng Sariling Ulam:', sel_custom_ph: 'Halimbawa: Sinigang na Baboy',
                sel_save: 'I-save sa Kalendaryo', sel_clear: 'Burahin ang Ulam',
                tr_title: 'Tagasalin', tr_ph: 'I-type o i-paste ang teksto dito...',
                tr_btn: 'Isalin', tr_loading: 'Isinasalin...', tr_copy: 'Kopyahin',
                tr_err: 'May error sa pagsasalin.',
                toast_plan: 'Nailagay na sa Kalendaryo ang ulam para sa isang linggo!',
                toast_savefail: 'Hindi na-save ang pagbabago. Subukan ulit.',
                toast_empty: 'Walang laman ang kalendaryo.',
                toast_cleared: 'Nabura na ang lahat ng ulam sa kalendaryo.',
                confirm_clear: 'Burahin ang lahat ng ulam sa kalendaryo?',
                toast_copied: 'Nakopya na ang salin!',
                toast_copyfail: 'Hindi makopya. I-select at kopyahin nang mano-mano.',
                err_conn: 'Pasensya na, may problema sa koneksyon.'
            },
            en: {
                nav_translator: 'Translator', logout: 'Logout',
                hero_title: 'What do you want to cook today?',
                hero_sub: 'Search thousands of delicious Filipino recipes',
                search_ph: 'Example: Adobo, Sinigang, Tapsilog...', search_btn: 'Search',
                cal_title: 'Weekly Meal Calendar',
                cal_hint: 'Pick a day and mealtime to add a dish.',
                clear_all: 'Clear all',
                featured: 'Featured Recipes', count: '{n} recipes',
                view_recipe: 'View recipe', dish: 'Dish',
                no_results_title: 'No recipes found',
                no_results_sub: 'Try another word, for example "adobo" or "sinigang".',
                add: '+ Add', today: 'Today', del: 'Delete',
                chat_sub: 'Ready to answer your questions',
                chat_welcome: "Hello! I'm your KusinaAI Chef. Ask me anything about food!",
                chat_ph: 'Ask about a dish...',
                ingredients: 'Ingredients', instructions: 'Instructions',
                no_ingredients: 'No ingredients listed.', no_instructions: 'No instructions listed.',
                sel_title: 'Choose a dish for {day}', sel_sub: 'Meal: {meal}',
                sel_cookbook: 'Choose from the Cookbook:', sel_dropdown: '-- Choose from the Cookbook --',
                sel_custom: 'Or type your own dish:', sel_custom_ph: 'Example: Pork Sinigang',
                sel_save: 'Save to Calendar', sel_clear: 'Remove dish',
                tr_title: 'Translator', tr_ph: 'Type or paste text here...',
                tr_btn: 'Translate', tr_loading: 'Translating...', tr_copy: 'Copy',
                tr_err: 'Translation error.',
                toast_plan: 'Your one-week meal plan is now in the calendar!',
                toast_savefail: "Couldn't save the change. Please try again.",
                toast_empty: 'The calendar is already empty.',
                toast_cleared: 'All dishes were removed from the calendar.',
                confirm_clear: 'Remove all dishes from the calendar?',
                toast_copied: 'Translation copied!',
                toast_copyfail: "Couldn't copy. Please select and copy manually.",
                err_conn: 'Sorry, there is a connection problem.'
            }
        };

        let lang = 'tl';
        try { lang = localStorage.getItem('kusina_lang') === 'en' ? 'en' : 'tl'; } catch (e) {}

        function t(key, vars) {
            let s = (I18N[lang] && I18N[lang][key]) || I18N.tl[key] || key;
            if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
            return s;
        }
        function dayLabel(d) { return lang === 'en' ? (DAY_EN[d] || d) : d; }
        function mealLabel(m) { return lang === 'en' ? (MEAL_EN[m] || m) : m; }

        function applyStaticLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            document.getElementById('lang-tl').classList.toggle('active', lang === 'tl');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.getElementById('trBtn').innerHTML = '<i class="fa-solid fa-language"></i> ' + t('tr_btn');
            document.getElementById('trCopy').innerHTML = '<i class="fa-regular fa-copy"></i> ' + t('tr_copy');
        }

        function setLang(l) {
            if (l === lang) return;
            lang = l;
            try { localStorage.setItem('kusina_lang', l); } catch (e) {}
            applyStaticLang();
            renderCalendar();
            renderRecipes(currentRecipes);
            if (document.getElementById('recipeModal').style.display === 'flex' && modalIdx >= 0) openRecipeModal(modalIdx);
        }

        // ---------------------------------------------------------------
        // TRANSLATION OF CONTENT (recipes, calendar, modal) via AI + cache
        // ---------------------------------------------------------------
        const TR_MEM = {};
        function trGet(target, s) {
            const k = 'kt:' + target + ':' + s;
            if (k in TR_MEM) return TR_MEM[k];
            try { const c = localStorage.getItem(k); if (c !== null) { TR_MEM[k] = c; return c; } } catch (e) {}
            return null;
        }
        function trSet(target, s, v, persist) {
            const k = 'kt:' + target + ':' + s;
            TR_MEM[k] = v;
            if (persist) { try { localStorage.setItem(k, v); } catch (e) {} }
        }

        async function trBatch(texts, target) {
            const src = texts.map(s => String(s == null ? '' : s).trim());
            const miss = [];
            src.forEach(s => { if (s && trGet(target, s) === null && !miss.includes(s)) miss.push(s); });
            for (let k = 0; k < miss.length; k += 40) {
                const chunk = miss.slice(k, k + 40);
                let ok = false;
                try {
                    const r = await fetch('/api/translate_batch', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ texts: chunk, target: target })
                    });
                    const d = await r.json();
                    if (d.ok && Array.isArray(d.translations) && d.translations.length === chunk.length) {
                        chunk.forEach((s, j) => trSet(target, s, String(d.translations[j] || s), true));
                        ok = true;
                    }
                } catch (e) {}
                if (!ok) chunk.forEach(s => trSet(target, s, s, false)); // huwag nang ulitin sa session na ito
            }
            return src.map(s => { if (!s) return ''; const c = trGet(target, s); return c !== null ? c : s; });
        }

        function esc(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function dispTitle(r) { return (r._tr && r._tr[lang] && r._tr[lang].title) || r.title; }
        function dispCat(r) { return (r._tr && r._tr[lang] && r._tr[lang].category) || r.category || t('dish'); }

        document.addEventListener('DOMContentLoaded', () => {
            applyStaticLang();
            renderRecipes(initialRecipes);
            loadCalendarPlan();
        });

        function populateDropdown(recipes) {
            const dropdown = document.getElementById('recipeDropdown');
            dropdown.innerHTML = '<option value="">' + esc(t('sel_dropdown')) + '</option>' +
                recipes.map(r => `<option value="${esc(dispTitle(r))}">${esc(dispTitle(r))}</option>`).join('');
        }

        function renderRecipes(recipes) {
            currentRecipes = recipes;
            const grid = document.getElementById('recipeGrid');
            document.getElementById('recipeCount').textContent = recipes.length ? t('count', { n: recipes.length }) : '';
            populateDropdown(recipes);

            if (!recipes.length) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-face-frown-open"></i>
                        <b>${esc(t('no_results_title'))}</b>
                        ${esc(t('no_results_sub'))}
                    </div>`;
                return;
            }

            grid.innerHTML = recipes.map((r, i) => `
                <div class="recipe-card" onclick="openRecipeModal(${i})">
                    <div class="img-wrap">
                        <div class="img-ph" id="ph-${i}"><i class="fa-solid fa-bowl-food"></i><span>${esc(dispTitle(r))}</span></div>
                        <img class="recipe-img" id="img-${i}" ${r.image_url ? `src="${esc(r.image_url)}"` : ''} style="display:none"
                             onload="showImg(${i})" onerror="hideImg(${i})" alt="${esc(dispTitle(r))}">
                        <span class="kcal-badge"><i class="fa-solid fa-fire-flame-curved"></i> ${esc(r.kcal || 300)} kcal</span>
                    </div>
                    <div class="recipe-content">
                        <span class="recipe-tag" id="cat-${i}">${esc(dispCat(r))}</span>
                        <div class="recipe-title" id="title-${i}">${esc(dispTitle(r))}</div>
                        <div class="recipe-cta">${esc(t('view_recipe'))} <i class="fa-solid fa-arrow-right"></i></div>
                    </div>
                </div>
            `).join('');
            recipes.forEach((r, i) => loadDishImage(r, i));
            translateRecipes(recipes);
        }

        async function translateRecipes(recipes) {
            const L = lang;
            const items = [];
            recipes.forEach(r => { items.push(r.title); items.push(r.category || ''); });
            const out = await trBatch(items, L);
            if (L !== lang || recipes !== currentRecipes) return;
            recipes.forEach((r, i) => {
                r._tr = r._tr || {};
                r._tr[L] = { title: out[2 * i] || r.title, category: out[2 * i + 1] || r.category || t('dish') };
                const te = document.getElementById('title-' + i), ce = document.getElementById('cat-' + i),
                      pe = document.querySelector('#ph-' + i + ' span'), ie = document.getElementById('img-' + i);
                if (te) te.textContent = r._tr[L].title;
                if (ce) ce.textContent = r._tr[L].category;
                if (pe) pe.textContent = r._tr[L].title;
                if (ie) ie.alt = r._tr[L].title;
            });
            populateDropdown(recipes);
        }

        function showImg(i) {
            const img = document.getElementById('img-' + i), ph = document.getElementById('ph-' + i);
            if (img) img.style.display = 'block';
            if (ph) ph.style.display = 'none';
        }

        function hideImg(i) {
            const img = document.getElementById('img-' + i), ph = document.getElementById('ph-' + i);
            if (img) img.style.display = 'none';
            if (ph) ph.style.display = 'flex';
        }

        async function loadDishImage(r, i) {
            if (r.image_url) return;
            const key = 'dimg:' + r.title;
            let url = null;
            try { url = sessionStorage.getItem(key); } catch (e) {}
            if (url === null) {
                try {
                    const res = await fetch('/api/dish_image?title=' + encodeURIComponent(r.title));
                    url = (await res.json()).url || '';
                    try { sessionStorage.setItem(key, url); } catch (e) {}
                } catch (e) { url = ''; }
            }
            if (url) {
                r.image_url = url;
                const img = document.getElementById('img-' + i);
                if (img && currentRecipes[i] === r) img.src = url;
            }
        }

        async function openRecipeModal(i) {
            const r = currentRecipes[i];
            if (!r) return;
            modalIdx = i;
            const L = lang;
            document.getElementById('modalTitle').innerText = dispTitle(r);
            document.getElementById('modalIngredients').innerText = r.ingredients || t('no_ingredients');
            document.getElementById('modalInstructions').innerText = r.instructions || t('no_instructions');
            const mImg = document.getElementById('modalImage');
            if (r.image_url) {
                mImg.style.display = 'block';
                mImg.src = r.image_url;
            } else {
                mImg.style.display = 'none';
                mImg.removeAttribute('src');
            }
            document.getElementById('recipeModal').style.display = 'flex';

            // isalin sa napiling wika
            const out = await trBatch([r.title, r.ingredients, r.instructions], L);
            if (L !== lang || modalIdx !== i) return;
            if (out[0]) document.getElementById('modalTitle').innerText = out[0];
            if (out[1]) document.getElementById('modalIngredients').innerText = out[1];
            if (out[2]) document.getElementById('modalInstructions').innerText = out[2];
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function loadCalendarPlan() {
            try {
                const res = await fetch('/api/plan');
                const data = await res.json();
                planData = data.plan || {};
            } catch (e) {
                planData = {};
            }
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = days.map((day, di) => `
                <div class="day-column ${di === todayIndex ? 'today' : ''}">
                    <div class="day-title">${esc(dayLabel(day))} ${di === todayIndex ? '<span class="today-badge">' + esc(t('today')) + '</span>' : ''}</div>
                    ${meals.map(meal => {
                        const raw = (planData[day] && planData[day][meal]) ? planData[day][meal] : '-';
                        const filled = raw !== '-';
                        return `
                            <div class="meal-slot ${filled ? 'filled' : ''}" onclick="openMealSelector('${day}', '${meal}')">
                                ${filled ? `<button class="slot-del" title="${esc(t('del'))}" aria-label="${esc(t('del'))}" onclick="event.stopPropagation(); deleteSlot('${day}', '${meal}')"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                <div class="slot-label"><i class="fa-solid ${mealIcons[meal]}"></i> ${esc(mealLabel(meal))}</div>
                                <div class="slot-value ${filled ? '' : 'empty'}" ${filled ? `data-raw="${esc(raw)}"` : ''}>${filled ? esc(raw) : esc(t('add'))}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `).join('');
            translateCalendar();
        }

        async function translateCalendar() {
            const L = lang;
            const els = Array.from(document.querySelectorAll('.slot-value[data-raw]'));
            if (!els.length) return;
            const raws = Array.from(new Set(els.map(e => e.dataset.raw)));
            const out = await trBatch(raws, L);
            if (L !== lang) return;
            const map = {};
            raws.forEach((r, i) => { map[r] = out[i]; });
            document.querySelectorAll('.slot-value[data-raw]').forEach(e => { e.textContent = map[e.dataset.raw] || e.dataset.raw; });
        }

        function openMealSelector(day, meal) {
            activeDay = day;
            activeMeal = meal;
            document.getElementById('selectorTitle').innerText = t('sel_title', { day: dayLabel(day) });
            document.getElementById('selectorSubtitle').innerText = t('sel_sub', { meal: mealLabel(meal) });

            const currentVal = (planData[day] && planData[day][meal] && planData[day][meal] !== '-') ? planData[day][meal] : '';
            document.getElementById('customMealInput').value = currentVal;
            document.getElementById('recipeDropdown').value = '';

            document.getElementById('mealSelectorModal').style.display = 'flex';
        }

        async function savePlan() {
            try {
                await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan: planData })
                });
            } catch (e) {
                showToast(t('toast_savefail'));
            }
        }

        async function confirmMealSelection() {
            const dropdownVal = document.getElementById('recipeDropdown').value;
            const customVal = document.getElementById('customMealInput').value.trim();
            const selectedVal = dropdownVal || customVal || '-';

            if (!planData[activeDay]) planData[activeDay] = {};
            planData[activeDay][activeMeal] = selectedVal;

            renderCalendar();
            closeModal('mealSelectorModal');
            await savePlan();
        }

        async function clearMealSelection() {
            if (planData[activeDay]) {
                planData[activeDay][activeMeal] = '-';
            }
            renderCalendar();
            closeModal('mealSelectorModal');
            await savePlan();
        }

        async function deleteSlot(day, meal) {
            if (planData[day]) planData[day][meal] = '-';
            renderCalendar();
            await savePlan();
        }

        async function clearAllPlan() {
            const hasAny = Object.values(planData).some(d => d && Object.values(d).some(v => v && v !== '-'));
            if (!hasAny) { showToast(t('toast_empty')); return; }
            if (!confirm(t('confirm_clear'))) return;
            planData = {};
            renderCalendar();
            await savePlan();
            showToast(t('toast_cleared'));
        }

        async function searchRecipes() {
            const q = document.getElementById('searchInput').value;
            const res = await fetch(`/api/recipes?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            renderRecipes(data.recipes);
        }

        function quickSearch(term) {
            document.getElementById('searchInput').value = term;
            searchRecipes();
            document.getElementById('recipeGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function toggleChat() {
            const drawer = document.getElementById('chatDrawer');
            drawer.style.display = (drawer.style.display === 'flex') ? 'none' : 'flex';
            if (drawer.style.display === 'flex') document.getElementById('chatInput').focus();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        // ---------- TRANSLATOR BOX ----------
        let trDir = 'en-tl';

        function openTranslator() {
            document.getElementById('translatorModal').style.display = 'flex';
            document.getElementById('trInput').focus();
        }

        function swapLang() {
            trDir = trDir === 'en-tl' ? 'tl-en' : 'en-tl';
            document.getElementById('langFrom').textContent = trDir === 'en-tl' ? 'English' : 'Tagalog';
            document.getElementById('langTo').textContent = trDir === 'en-tl' ? 'Tagalog' : 'English';
            const out = document.getElementById('trOut').textContent;
            const res = document.getElementById('trResult');
            if (res.style.display !== 'none' && !res.classList.contains('error') && out) {
                document.getElementById('trInput').value = out;
            }
            res.style.display = 'none';
        }

        async function translateText() {
            const input = document.getElementById('trInput');
            const text = input.value.trim();
            if (!text) return;
            const btn = document.getElementById('trBtn');
            const res = document.getElementById('trResult');
            const out = document.getElementById('trOut');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + t('tr_loading');
            try {
                const r = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, direction: trDir })
                });
                const data = await r.json();
                res.classList.toggle('error', !data.ok);
                out.textContent = data.ok ? data.translation : (data.error || t('tr_err'));
                document.getElementById('trCopy').style.display = data.ok ? 'inline-block' : 'none';
            } catch (e) {
                res.classList.add('error');
                out.textContent = t('err_conn');
                document.getElementById('trCopy').style.display = 'none';
            }
            res.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-language"></i> ' + t('tr_btn');
        }

        async function copyTranslation() {
            try {
                await navigator.clipboard.writeText(document.getElementById('trOut').textContent);
                showToast(t('toast_copied'));
            } catch (e) {
                showToast(t('toast_copyfail'));
            }
        }

        // ---------- TOAST + AI PLAN ----------
        function showToast(msg) {
            let el = document.getElementById('toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast';
                el.className = 'toast';
                document.body.appendChild(el);
            }
            el.innerHTML = '<i class="fa-solid fa-circle-check"></i><span></span>';
            el.querySelector('span').textContent = msg;
            requestAnimationFrame(() => el.classList.add('show'));
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => el.classList.remove('show'), 3500);
        }

        // Kapag nagbigay ang AI ng pang-isang-linggong plano, ilagay agad sa kalendaryo at i-save.
        async function applyAiPlan(plan) {
            for (const day of Object.keys(plan)) {
                if (!days.includes(day)) continue;
                if (!planData[day]) planData[day] = {};
                for (const meal of meals) {
                    if (plan[day][meal]) planData[day][meal] = plan[day][meal];
                }
            }
            renderCalendar();
            try {
                await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plan: planData })
                });
                showToast(t('toast_plan'));
            } catch (e) {
                showToast(t('toast_savefail'));
            }
        }

        function formatReply(s) {
            return esc(s)
                .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if (!txt) return;

            const chatBody = document.getElementById('chatBody');
            chatBody.insertAdjacentHTML('beforeend', `<div class="chat-msg user">${esc(txt)}</div>`);
            input.value = '';
            chatBody.insertAdjacentHTML('beforeend', `<div class="chat-msg ai" id="typingMsg"><div class="typing"><span></span><span></span><span></span></div></div>`);
            chatBody.scrollTop = chatBody.scrollHeight;

            let reply;
            try {
                const res = await fetch('/ask_ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: txt, lang: lang })
                });
                const data = await res.json();
                reply = data.reply;
                if (data.plan) applyAiPlan(data.plan);
            } catch (e) {
                reply = t('err_conn');
            }
            const typing = document.getElementById('typingMsg');
            if (typing) typing.remove();
            chatBody.insertAdjacentHTML('beforeend', `<div class="chat-msg ai">${formatReply(reply)}</div>`);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
